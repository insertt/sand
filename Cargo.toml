[package]
name = "sand"
version = "0.1.1"
edition = "2024"
description = "Run AI coding agents in Docker Sandboxes with one command"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23"
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
ctrlc = "3.5.2"
dialoguer = { version = "0.12.0", default-features = false }
dirs = "7.0.0"
dunce = "1.0.5"
jsonc-parser = { version = "0.34.0", features = ["serde", "cst"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tern-sdk = "0.2"
toml = "1.1.8"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

[dev-dependencies]
tempfile = "3.27.0"
