[package]
name = "sand"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Run AI coding agents in Docker Sandboxes with one command"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
ctrlc = "3.5.2"
dialoguer = { version = "0.12.0", default-features = false }
dirs = "7.0.0"
dunce = "1.0.5"
jsonc-parser = { version = "0.34.0", features = ["serde", "cst"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
