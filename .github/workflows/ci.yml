name: CI

on:
  push:
    branches: [main]
  # PRs opened by a maintainer (owner, org member, or collaborator) build on
  # every push. Everyone else's PRs build only after a maintainer approves
  # them, so unreviewed code never runs CI; fork PRs still get a read-only
  # token and no secrets either way.
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

permissions:
  contents: read

# Events that don't qualify for a build (PR pushes from non-maintainers,
# comments, change requests, approvals from non-maintainers, approvals of PRs
# that already build on push) get a group of their own, so they can't cancel a
# real build.
concurrency:
  group: >-
    ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{
      ((github.event_name == 'pull_request' &&
        !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
       (github.event_name == 'pull_request_review' &&
        !(github.event.review.state == 'approved' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
          !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)))) &&
      github.run_id || 'build' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ci:
    # Push / manual runs always build. PR pushes build when a maintainer
    # (owner, org member, or collaborator) opened the PR. Reviews build when a
    # maintainer approves a PR from anyone else (a maintainer's own PR has
    # already built on push).
    if: >-
      (github.event_name != 'pull_request' && github.event_name != 'pull_request_review') ||
      (github.event_name == 'pull_request' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                github.event.pull_request.author_association)) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'approved' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                github.event.review.author_association) &&
       !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                 github.event.pull_request.author_association))
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          # For approvals, build exactly the commit that was approved rather
          # than whatever the PR head has moved to since.
          ref: ${{ github.event.review.commit_id || github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

  # The release ships static musl executables for Linux; build them here so a
  # musl-only breakage (the TLS library has C and assembly parts) shows up
  # before a release does.
  musl:
    # Same gate as `ci`.
    if: >-
      (github.event_name != 'pull_request' && github.event_name != 'pull_request_review') ||
      (github.event_name == 'pull_request' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                github.event.pull_request.author_association)) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'approved' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                github.event.review.author_association) &&
       !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                 github.event.pull_request.author_association))
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.review.commit_id || github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --locked --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
